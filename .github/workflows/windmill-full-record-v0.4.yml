name: Windmill Full Record Integration v0.4
"on":
  push:
    paths: ["windmill-full-record-v0.3/**","windmill-full-record-v0.4/**",".github/workflows/windmill-full-record-v0.4.yml"]
  pull_request:
    paths: ["windmill-full-record-v0.3/**","windmill-full-record-v0.4/**",".github/workflows/windmill-full-record-v0.4.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  conformance:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10","3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements.txt
      - run: python windmill-full-record-v0.4/scripts/validate.py
