name: Windmill Full Record Schema Gate v0.3
"on":
  push:
    paths:
      - "windmill-full-record-v0.3/**"
      - ".github/workflows/windmill-full-record-v0.3.yml"
  pull_request:
    paths:
      - "windmill-full-record-v0.3/**"
      - ".github/workflows/windmill-full-record-v0.3.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  schema-gate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install validation dependency
        run: python -m pip install -r requirements.txt
      - name: Verify source schemas and fail-closed examples
        run: python windmill-full-record-v0.3/scripts/validate.py --self-test
